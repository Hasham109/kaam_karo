openapi: 3.1.0
info:
  title: Kaam Karo Notifications API
  version: 0.1.0
  description: >
    Module M15 Notifications API (ARCH §4 M15, §7; BP §24, §80, §84 item 116).
    Produces and delivers in-app and push notifications from domain events, handles
    user category preferences, read states, and bilingual template rendering.
servers:
  - url: /v1
paths:
  /notifications:
    get:
      summary: List notifications inbox
      description: >
        Returns paginated in-app notifications for the authenticated user (BP §12 C26, §13 P19).
        Includes unread count and priority labeling. Requirement: NOTIF-001, NOTIF-009.
      operationId: listNotifications
      x-requirement-ids:
        - NOTIF-001
        - NOTIF-009
      tags:
        - notifications
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, unread, read]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of notifications and unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsListResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      description: >
        Marks a specific notification as read by setting readAt (BP §12 C26, §13 P19).
        Requirement: NOTIF-001.
      operationId: markNotificationRead
      x-requirement-ids:
        - NOTIF-001
      tags:
        - notifications
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationItem'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /notifications/read-all:
    patch:
      summary: Mark all notifications as read
      description: Marks all unread notifications for the user as read.
      operationId: markAllNotificationsRead
      x-requirement-ids:
        - NOTIF-001
      tags:
        - notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Count of marked notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  markedCount:
                    type: integer
                required:
                  - markedCount

  /notifications/preferences:
    get:
      summary: Get user notification preferences
      description: >
        Returns category notification settings for the user (BP §74, §84 item 116; NOTIF-009).
      operationId: getNotificationPreferences
      x-requirement-ids:
        - NOTIF-009
      tags:
        - notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User notification preferences by category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'

    put:
      summary: Update user notification preferences
      description: >
        Updates category enable/disable toggles. Critical categories cannot be disabled (NOTIF-009).
      operationId: updateNotificationPreferences
      x-requirement-ids:
        - NOTIF-009
      tags:
        - notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'

components:
  schemas:
    NotificationPriority:
      type: string
      enum: [HIGH, MEDIUM, LOW]

    NotificationChannel:
      type: string
      enum: [PUSH, IN_APP]

    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED]

    NotificationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          example: booking.accepted
        category:
          type: string
          example: JOBS
        priority:
          $ref: '#/components/schemas/NotificationPriority'
        isCritical:
          type: boolean
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        locale:
          type: string
          enum: [en, ur]
        title:
          type: string
        body:
          type: string
        status:
          $ref: '#/components/schemas/NotificationStatus'
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventType
        - category
        - priority
        - isCritical
        - channel
        - locale
        - title
        - body
        - status
        - createdAt

    NotificationsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        unreadCount:
          type: integer
        total:
          type: integer
      required:
        - items
        - unreadCount
        - total

    NotificationCategoryPreference:
      type: object
      properties:
        category:
          type: string
          enum: [JOBS, PAYMENTS, SUPPORT, MESSAGES, ACCOUNT]
        enabled:
          type: boolean
        isCritical:
          type: boolean
          description: If true, category cannot be disabled (NOTIF-009)
      required:
        - category
        - enabled
        - isCritical

    NotificationPreferencesResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/NotificationCategoryPreference'
      required:
        - categories

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
                enum: [JOBS, PAYMENTS, SUPPORT, MESSAGES, ACCOUNT]
              enabled:
                type: boolean
            required:
              - category
              - enabled
      required:
        - categories
