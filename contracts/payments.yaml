openapi: 3.1.0
info:
  title: Payments & Settlement Service
  description: >
    Payment state model supporting cash recording and digital payments via gateway abstraction,
    post-completion timing gating (D-003), and idempotent initiation (ARCH §4 M11, §6.8;
    BP §17, §25, §26, §31.2; PAY-001..003, PAY-008, PAY-TIMING-001, LEDGER-001..002).
  version: 0.1.0

paths:
  /v1/payments/initiate:
    post:
      summary: Initiate payment for completed booking
      description: >
        Initiates a payment for a completed booking. Payment initiation is permitted strictly
        after the booking status is COMPLETED (D-003, PAY-TIMING-001). Double-tap requests with
        the same idempotencyKey return the existing payment without duplication (PAY-002).
      operationId: initiatePayment
      x-requirement-ids:
        - PAY-001
        - PAY-002
        - PAY-008
        - PAY-TIMING-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '201':
          description: Payment initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Payment not allowed before completion or already settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payments/confirm:
    post:
      summary: Confirm or fail digital payment via gateway
      description: >
        Processes gateway result callback or confirmation. Creates an immutable append-only payment row
        recording the updated financial state (PAY-001, PAY-003).
      operationId: confirmDigitalPayment
      x-requirement-ids:
        - PAY-001
        - PAY-003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Digital payment confirmed or marked failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid confirmation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Payment reference not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payments/cash-record:
    post:
      summary: Provider record cash payment at billing
      description: >
        Records that the completed booking was paid in cash to the provider (D-016, D-030).
        CASH can be recorded only when no confirmed digital payment exists (LEDGER-002) and
        strictly after completion (D-003, PAY-TIMING-001).
      operationId: recordCashPayment
      x-requirement-ids:
        - PAY-001
        - PAY-TIMING-001
        - LEDGER-001
        - LEDGER-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCashPaymentRequest'
      responses:
        '201':
          description: Cash payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid cash payment data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Caller is not the assigned provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Booking not completed or digital payment already settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payments/booking/{bookingId}:
    get:
      summary: Retrieve payment status for a booking
      description: >
        Returns current payment state and history for a given booking (PAY-001, PAY-003).
      operationId: getBookingPayment
      x-requirement-ids:
        - PAY-001
        - PAY-003
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payments/booking/{bookingId}/fee-display:
    get:
      summary: Retrieve per-party fee display data for booking
      description: >
        Returns role-scoped fee display data. Customers see bill lines and total with platform
        commission strictly hidden (D-025, COMM-004). Providers see total bill, labour commission deduction
        and net earnings (D-016, COMM-004). Finance sees full audit transparency.
      operationId: getBookingFeeDisplay
      x-requirement-ids:
        - COMM-001
        - COMM-002
        - COMM-003
        - COMM-004
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fee display retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeDisplayResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payments/provider/{providerProfileId}/balance:
    get:
      summary: Retrieve current provider earnings balance
      description: >
        Calculates current provider balance from append-only ledger entries (ARCH §6.8).
        Balance = SUM(credits) - SUM(debits). Negative balance indicates unpaid commissions (D-020).
      operationId: getProviderBalance
      x-requirement-ids:
        - LEDGER-001
        - LEDGER-003
        - LEDGER-004
      parameters:
        - name: providerProfileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider balance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderBalanceResponse'

  /v1/payments/provider/{providerProfileId}/ledger:
    get:
      summary: Retrieve provider earnings ledger history
      description: >
        Retrieves list of ledger entries for Partner wallet / earnings history screen P15 (ARCH §6.8, D-016).
      operationId: getProviderLedger
      x-requirement-ids:
        - LEDGER-001
        - LEDGER-005
        - LEDGER-006
      parameters:
        - name: providerProfileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of provider ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderLedgerEntry'

  /v1/payments/admin/provider/{providerProfileId}/ledger:
    get:
      summary: Admin / Finance view of provider ledger
      description: >
        Provides complete financial audit view of provider balance and ledger entries for Admin A09 (ARCH §6.8).
      operationId: getAdminProviderLedger
      x-requirement-ids:
        - LEDGER-001
        - LEDGER-006
      parameters:
        - name: providerProfileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Full admin provider ledger audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProviderLedgerResponse'

  /v1/payments/company/submit:
    post:
      summary: Provider submits claim to pay company commission
      description: >
        Submits bank/wallet transaction reference and optional screenshot for unpaid commission (D-020, D-021; LEDGER-PAY-002, LEDGER-PAY-003).
        A submitted-but-unverified payment does not unblock the provider.
      operationId: submitCommissionPayment
      x-requirement-ids:
        - LEDGER-PAY-002
        - LEDGER-PAY-003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCommissionPaymentRequest'
      responses:
        '201':
          description: Submission accepted into Finance queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPaymentSubmissionResponse'
        '400':
          description: Invalid submission parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payments/company/submissions/provider/{providerProfileId}:
    get:
      summary: List commission payment submissions for a provider
      description: Retrieves history of company payment claims for Partner wallet P15.
      operationId: getProviderCommissionSubmissions
      x-requirement-ids:
        - LEDGER-PAY-002
      parameters:
        - name: providerProfileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider commission payment submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommissionPaymentSubmissionResponse'

  /v1/payments/company/submissions/pending:
    get:
      summary: Finance verification queue for pending commission payments
      description: Lists pending commission payment submissions for Admin A09 (Finance / Super Admin only).
      operationId: getPendingCommissionSubmissions
      x-requirement-ids:
        - LEDGER-PAY-004
      responses:
        '200':
          description: List of pending submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommissionPaymentSubmissionResponse'

  /v1/payments/company/submissions/{submissionId}/decision:
    post:
      summary: Finance decides a commission payment submission
      description: >
        Approves or rejects a commission payment claim with mandatory audit reason (ROLE-003, ABUSE-010).
        Approval writes an audited COMPANY_PAYMENT_CREDIT ledger entry and auto-unblocks if balance >= 0.
      operationId: decideCommissionPayment
      x-requirement-ids:
        - LEDGER-PAY-004
        - LEDGER-PAY-005
        - ROLE-003
        - ABUSE-010
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideCommissionPaymentRequest'
      responses:
        '200':
          description: Submission decided successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPaymentSubmissionResponse'
        '400':
          description: Missing reason or invalid decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Separation of duty violation (cannot decide own submission)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Submission already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payments/provider/{providerProfileId}/unpaid-block:
    get:
      summary: Get provider hiring block status for unpaid commission
      description: Returns whether provider is blocked, amount owed, and bilingual reason copy (D-020, D-021; LEDGER-NEG-001..005).
      operationId: getProviderHiringBlock
      x-requirement-ids:
        - LEDGER-NEG-001
        - LEDGER-NEG-002
        - LEDGER-NEG-003
      parameters:
        - name: providerProfileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider hiring block status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHiringBlockResponse'

components:
  schemas:
    InitiatePaymentRequest:
      type: object
      required:
        - bookingId
        - method
      properties:
        bookingId:
          type: string
          format: uuid
        method:
          type: string
          enum: [DIGITAL, CASH]
        amountMinor:
          type: integer
          minimum: 1
          description: Optional expected bill amount in PKR minor units (paisa)
        idempotencyKey:
          type: string
          description: Idempotency token to prevent double-tap payment initiation (REL-008)

    ConfirmPaymentRequest:
      type: object
      required:
        - paymentRef
        - gatewayRef
        - success
      properties:
        paymentRef:
          type: string
          format: uuid
        gatewayRef:
          type: string
        success:
          type: boolean
        failureReason:
          type: string

    RecordCashPaymentRequest:
      type: object
      required:
        - bookingId
      properties:
        bookingId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 1
        notes:
          type: string

    PaymentResponse:
      type: object
      required:
        - paymentRef
        - bookingId
        - method
        - status
        - amountMinor
        - occurredAt
      properties:
        paymentRef:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerProfileId:
          type: string
          format: uuid
        providerProfileId:
          type: string
          format: uuid
        method:
          type: string
          enum: [CASH, DIGITAL]
        status:
          type: string
          enum: [CASH_RECORDED, PENDING, SUCCEEDED, FAILED]
        amountMinor:
          type: integer
          description: Bill amount in PKR minor units (paisa)
        gatewayRef:
          type: string
        checkoutUrl:
          type: string
        occurredAt:
          type: string
          format: date-time
        isSettled:
          type: boolean

    PaymentStatusResponse:
      type: object
      required:
        - bookingId
        - hasPayment
        - isSettled
      properties:
        bookingId:
          type: string
          format: uuid
        hasPayment:
          type: boolean
        isSettled:
          type: boolean
        currentStatus:
          type: string
          enum: [CASH_RECORDED, PENDING, SUCCEEDED, FAILED]
        method:
          type: string
          enum: [CASH, DIGITAL]
        amountMinor:
          type: integer
        paidByLabel:
          type: string
          description: Customer display string e.g. "Cash to Provider" or "Digital via Gateway" (D-030)
        history:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponse'

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    FeeDisplayResponse:
      type: object
      required:
        - role
        - feeDisplay
      properties:
        role:
          type: string
          enum: [CUSTOMER, PROVIDER, ADMIN]
        feeDisplay:
          type: object
          description: Role-specific fee breakdown. Customers do not receive platform commission figures.

    ProviderBalanceResponse:
      type: object
      required:
        - providerProfileId
        - balanceMinor
        - isNegative
        - totalCreditsMinor
        - totalDebitsMinor
        - entryCount
      properties:
        providerProfileId:
          type: string
          format: uuid
        balanceMinor:
          type: integer
          description: Net balance in PKR minor units (paisa). balance = credits - debits.
        isNegative:
          type: boolean
          description: True if balance < 0 (unpaid commission liability D-020).
        totalCreditsMinor:
          type: integer
        totalDebitsMinor:
          type: integer
        entryCount:
          type: integer

    ProviderLedgerEntry:
      type: object
      required:
        - id
        - providerProfileId
        - entryType
        - direction
        - amountMinor
        - netImpactMinor
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        providerProfileId:
          type: string
          format: uuid
        entryType:
          type: string
          enum:
            - COMMISSION_DEBIT
            - JOB_CREDIT
            - COMPANY_PAYMENT_CREDIT
            - SETTLEMENT_DEBIT
            - REVERSAL
        direction:
          type: string
          enum: [DEBIT, CREDIT]
        amountMinor:
          type: integer
          minimum: 1
        netImpactMinor:
          type: integer
          description: Signed integer amount (+ for credit, - for debit)
        bookingId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        billTotalMinor:
          type: integer
        commissionableMinor:
          type: integer
        commissionMinor:
          type: integer
        commissionRate:
          type: number
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminProviderLedgerResponse:
      type: object
      required:
        - balance
        - history
      properties:
        balance:
          $ref: '#/components/schemas/ProviderBalanceResponse'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ProviderLedgerEntry'

    SubmitCommissionPaymentRequest:
      type: object
      required:
        - providerProfileId
        - amountMinor
        - transactionRef
      properties:
        providerProfileId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 1
        transactionRef:
          type: string
        screenshotMediaId:
          type: string
          format: uuid

    DecideCommissionPaymentRequest:
      type: object
      required:
        - action
        - decisionReason
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT]
        decisionReason:
          type: string
          description: Mandatory audit reason for Finance decision (ROLE-003)

    CommissionPaymentSubmissionResponse:
      type: object
      required:
        - id
        - providerProfileId
        - amountMinor
        - transactionRef
        - submittedByUserId
        - status
        - submittedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        providerProfileId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 1
        transactionRef:
          type: string
        submittedByUserId:
          type: string
          format: uuid
        screenshotMediaId:
          type: string
          format: uuid
        status:
          type: string
          enum: [SUBMITTED, APPROVED, REJECTED]
        submittedAt:
          type: string
          format: date-time
        decidedByUserId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        decisionReason:
          type: string
        version:
          type: integer

    ProviderHiringBlockResponse:
      type: object
      required:
        - isBlocked
        - balanceMinor
        - amountOwedMinor
        - maxNegativeBalanceMinor
      properties:
        isBlocked:
          type: boolean
        balanceMinor:
          type: integer
        amountOwedMinor:
          type: integer
        maxNegativeBalanceMinor:
          type: integer
        blockReasonEn:
          type: string
        blockReasonUr:
          type: string
