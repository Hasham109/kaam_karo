# Contract: common (owner A01, M18 platform). Shared components for every module contract.
# Contract-first per ARCH §8 rule 7 / IMPL §3.4. No operations of its own.
openapi: 3.1.0
info:
  title: Kaam Karo — Common components
  version: 1.1.0
  description: |
    Shared error envelope, idempotency and request-ID headers (T2.2).
    - Error envelope (REL-001, REL-002, SEC-BASE-005; BP §29, §31.1; ARCH §8): every non-2xx
      response of every module has this body. Clients map `code` to an en/ur message through
      packages/i18n; `message` is developer text and is never shown as-is.
    - Idempotency (REL-008, REL-006; BP §31.2; ARCH §8 rule 3): operations marked with
      `x-idempotent: true` require the `Idempotency-Key` header. Same key + same request → the
      original response with `Idempotent-Replayed: true`. Same key + different body → 409
      IDEMPOTENCY_KEY_REUSED. First request still running → 409 IDEMPOTENCY_REQUEST_IN_PROGRESS
      (retryable: show "pending", retry later with the SAME key). Keys are kept 24 h by default
      (technical setting IDEMPOTENCY_KEY_TTL_HOURS). A replay carries the ORIGINAL status code
      and body (1.1.0). The first request may have finished but its result could not be
      stored → 409 IDEMPOTENCY_OUTCOME_UNKNOWN: the operation is never re-run for this key; show
      "pending/unknown" and read the resource. The original response was too large to store →
      409 IDEMPOTENCY_REPLAY_UNAVAILABLE: the action was done; read the resource. Idempotent
      handlers return replay-safe bodies only (IDs and states; never secrets, gateway tokens,
      OTPs or personal data), max IDEMPOTENCY_MAX_RESPONSE_BYTES (default 16 KiB).
    - Request ID: `X-Request-Id` in responses and `error.requestId` are generated by the server;
      a client-sent `X-Request-Id` is only kept as a hint in server logs.
    - Platform error codes: BAD_REQUEST 400, UNAUTHENTICATED 401, FORBIDDEN 403, NOT_FOUND 404,
      METHOD_NOT_ALLOWED 405, CONFLICT 409, PAYLOAD_TOO_LARGE 413, UNSUPPORTED_MEDIA_TYPE 415,
      VALIDATION_FAILED 422, IDEMPOTENCY_KEY_REQUIRED 428, IDEMPOTENCY_KEY_INVALID 400,
      IDEMPOTENCY_KEY_REUSED 409, IDEMPOTENCY_REQUEST_IN_PROGRESS 409 (retryable),
      IDEMPOTENCY_OUTCOME_UNKNOWN 409, IDEMPOTENCY_REPLAY_UNAVAILABLE 409,
      RATE_LIMITED 429 (retryable), INTERNAL_ERROR 500, CONFIG_NOT_SET 503,
      SERVICE_UNAVAILABLE 503 (retryable). Module codes (e.g. TRANSITION_NOT_ALLOWED) are listed
      in the owning module's contract.
paths: {}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated key (a UUID is recommended): 8–128 characters from A–Z a–z 0–9 and _ - colon dot.'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_\-:.]{8,128}$'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 'Optional client trace ID (8–64 characters from A–Z a–z 0–9 _ -), logged as a hint only; the server always generates the request ID.'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,64}$'
  headers:
    IdempotentReplayed:
      description: '`true` when the body is the stored original response.'
      schema:
        type: string
        enum: ['true']
    RequestId:
      description: 'Request ID, also in `error.requestId` and in server logs.'
      schema:
        type: string
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [issue]
      properties:
        field:
          type: string
          maxLength: 200
        issue:
          type: string
          maxLength: 200
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, retryable]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
            message:
              type: string
            requestId:
              type: ['string', 'null']
            retryable:
              type: boolean
            details:
              type: array
              maxItems: 50
              items:
                $ref: '#/components/schemas/ErrorDetail'
